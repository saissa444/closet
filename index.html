<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>衣櫥帳本</title>
<meta name="description" content="衣物建檔、盤點、花費統計與淘汰紀錄">
<meta name="theme-color" content="#E7E5E0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F1E1C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="衣櫥帳本">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<style>
:root{
  --bg:#E7E5E0;--surface:#F6F5F1;--surface2:#EEECE7;--ink:#34302C;--ink2:#6F6962;--ink3:#9A948C;--line:#D9D5CE;
  --mauve:#957A80;--mauve-ink:#7C6268;--mauve-soft:#E7DCDD;--sage:#7F8E78;--sage-soft:#DCE2D7;--brick:#A66B5B;--brick-soft:#F0DDD6;
  --shadow:0 1px 2px rgba(52,48,44,.06),0 10px 30px rgba(52,48,44,.07);
  --f:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei UI","Microsoft JhengHei",sans-serif;
  --num:"Avenir Next","Avenir","Segoe UI Variable Display","Segoe UI",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  --nav-h:62px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1F1E1C;--surface:#2A2826;--surface2:#33302D;--ink:#ECE7E1;--ink2:#ACA59D;--ink3:#7F7871;--line:#3E3A36;
  --mauve:#B99DA3;--mauve-ink:#D3B9BE;--mauve-soft:#433A3C;--sage:#A3B19B;--sage-soft:#343A31;--brick:#CF9483;--brick-soft:#48342E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1F1E1C;--surface:#2A2826;--surface2:#33302D;--ink:#ECE7E1;--ink2:#ACA59D;--ink3:#7F7871;--line:#3E3A36;
  --mauve:#B99DA3;--mauve-ink:#D3B9BE;--mauve-soft:#433A3C;--sage:#A3B19B;--sage-soft:#343A31;--brick:#CF9483;--brick-soft:#48342E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f);min-height:100vh;min-height:100dvh;overflow-x:hidden}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--mauve);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}
.small{font-size:13px}.tiny{font-size:12px}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* 版面 */
.app{max-width:1240px;margin:0 auto;padding:calc(14px + var(--safe-t)) 16px calc(var(--nav-h) + var(--safe-b) + 24px)}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 14px}
.vh h1{font-size:28px;line-height:1.15;margin:0;font-weight:700;letter-spacing:.04em}
.vh .sub{font-size:13px;color:var(--ink2);margin-top:4px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:inline-grid;place-items:center;color:var(--ink2);background:var(--surface);flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn.on{background:var(--ink);color:var(--surface)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);
  padding:0 8px var(--safe-b);display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--nav-h) + var(--safe-b))}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--ink3);letter-spacing:.05em}
.nav button svg{width:23px;height:23px}
.nav button.on{color:var(--ink)}
.nav .add span{width:48px;height:48px;border-radius:16px;background:var(--ink);color:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .15s}
.nav .add:active span{transform:scale(.94)}
.nav .add svg{width:24px;height:24px}
.nav .dot{position:relative}
.nav .dot::after{content:"";position:absolute;top:-1px;right:-4px;width:7px;height:7px;border-radius:50%;background:var(--brick)}
@media (min-width:900px){
  .nav{top:0;right:auto;width:200px;height:auto;display:flex;flex-direction:column;gap:4px;padding:28px 14px;border-top:0;border-right:1px solid var(--line)}
  .nav::before{content:"衣櫥帳本";order:-2;font-weight:700;letter-spacing:.12em;font-size:17px;padding:0 12px 18px}
  .nav button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:10px 12px;border-radius:12px}
  .nav button.on{background:var(--surface2)}
  .nav .add{order:-1;margin-bottom:12px}
  .nav .add span{width:100%;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px}
  .nav .add span svg{width:20px;height:20px}
  .nav .add span::after{content:"新增衣物"}
  .nav .add .lbl{display:none}
  .app{margin-left:200px;padding:28px 36px 48px;max-width:1300px}
  .vh h1{font-size:32px}
}

/* 色譜 */
.rail{margin:4px 0 16px}
.rail .bar{display:flex;height:46px;border-radius:14px;overflow:hidden;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line)}
.rail .seg{position:relative;min-width:6px;height:100%;transition:flex-grow .5s cubic-bezier(.2,.8,.2,1),opacity .2s,transform .2s;transform-origin:bottom}
.rail .seg{box-shadow:inset 0 0 0 1px rgba(128,128,128,.22)}
.rail.has-sel .seg:not(.sel){opacity:.28}
.rail .seg.sel{transform:scaleY(1.06)}
.rail .legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12.5px;color:var(--ink2)}
.rail .legend button{display:inline-flex;align-items:center;gap:6px;padding:2px 0}
.rail .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4)}
.rail .legend b{font-weight:600;color:var(--ink)}
.rail.anim .seg{animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}

/* 搜尋與篩選 */
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:12px;padding:0 12px;height:42px;box-shadow:inset 0 0 0 1px var(--line)}
.search svg{width:18px;height:18px;color:var(--ink3);flex:none}
.search input{flex:1;border:0;background:none;outline:none;font-size:16px;min-width:0}
.seg-ctl{display:inline-flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg-ctl button{padding:6px 12px;border-radius:9px;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.seg-ctl button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
@media (min-width:900px){.chips{margin:0;padding-left:0;padding-right:0;flex-wrap:wrap}}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-size:13.5px;color:var(--ink);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--surface);box-shadow:none}
.chip .x{opacity:.6;font-size:15px;line-height:1}
.chip i.sw{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4)}
.countline{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink2);margin:2px 0 10px}
.linkbtn{color:var(--mauve-ink);font-weight:600;font-size:13.5px}

/* 衣物格 */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1100px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (min-width:900px) and (max-width:1099px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{display:block;text-align:left;position:relative;min-width:0}
.ph{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--surface2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .25s}
.ph img.ok{opacity:1}
.ph .ph-fallback{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:600;letter-spacing:.1em}
.tile .badges{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:4px;flex-wrap:wrap;pointer-events:none}
.badge{font-size:11px;padding:2px 7px;border-radius:999px;background:rgba(246,245,241,.92);color:#34302C;font-weight:600}
.badge.sell{background:var(--mauve);color:#fff}.badge.idle{background:#e9e1cf;color:#5d5340}.badge.ret{background:#34302C;color:#F6F5F1}
.badge.qty{margin-left:auto}
.tile .tt{margin-top:8px;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ts{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px}
.tile .ts .num{margin-left:auto;flex:none;color:var(--ink)}
.tile.retired .ph{filter:grayscale(.85);opacity:.7}
.tile .tick{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:rgba(246,245,241,.9);box-shadow:inset 0 0 0 2px var(--ink3);display:none}
.selecting .tile .tick{display:block}
.selecting .tile .badges .qty{display:none}
.tile.sel .tick{background:var(--ink);box-shadow:none}
.tile.sel .tick::after{content:"";position:absolute;left:9px;top:5px;width:6px;height:11px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.tile.sel .ph{outline:3px solid var(--ink);outline-offset:-3px}
.empty{text-align:center;padding:48px 20px;color:var(--ink2)}
.empty h3{color:var(--ink);font-size:18px;margin:12px 0 6px}
.empty svg{width:54px;height:54px;color:var(--ink3)}

/* 面板 */
.panel{background:var(--surface);border-radius:20px;padding:18px;margin-bottom:14px}
.panel h2{font-size:17px;margin:0 0 4px;letter-spacing:.03em}
.panel .ph2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.cols{display:grid;gap:14px}
@media (min-width:900px){.cols{grid-template-columns:1fr 1fr;align-items:start}.cols>.panel{margin-bottom:0}}
.stack>*+*{margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 16px;border-radius:12px;background:var(--surface2);font-weight:600;font-size:14.5px;white-space:nowrap}
.btn.pri{background:var(--ink);color:var(--surface)}
.btn.soft{background:var(--mauve-soft);color:var(--mauve-ink)}
.btn.danger{background:var(--brick-soft);color:var(--brick)}
.btn.sm{height:34px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow>.btn{flex:1}

/* 總覽 */
.lede{font-size:19px;line-height:1.5;font-weight:500;margin:0 0 4px}
.lede b{font-family:var(--num);font-weight:700;font-size:1.25em}
.streak{display:flex;align-items:center;gap:14px}
.streak .big{font-family:var(--num);font-size:44px;font-weight:600;line-height:1}
.catgroup+.catgroup{margin-top:14px}
.catgroup h4{margin:0 0 6px;font-size:13px;color:var(--ink2);font-weight:600;letter-spacing:.06em}
.catrow{display:grid;grid-template-columns:5.2em 1fr auto;align-items:center;gap:10px;padding:7px 0;width:100%;text-align:left}
.catrow .nm{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catrow .track{height:10px;border-radius:6px;background:var(--surface2);position:relative;overflow:hidden}
.catrow .fill{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--sage);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.catrow.over .fill{background:var(--brick)}
.catrow .limitmark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.5}
.catrow .ct{font-family:var(--num);font-size:14px;min-width:4.6em;text-align:right}
.catrow.over .ct{color:var(--brick);font-weight:700}
.minis{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.minis::-webkit-scrollbar{display:none}
.mini{flex:none;width:76px;text-align:left}
.mini .ph{border-radius:10px}
.mini .cap{font-size:11.5px;color:var(--ink2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--brick-soft);color:var(--brick);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.notice b{color:inherit}
.notice .btn{margin-left:auto;flex:none}

/* 花費 */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface2);border-radius:14px;padding:12px 14px}
.kpi .k{font-size:12.5px;color:var(--ink2)}
.kpi .v{font-family:var(--num);font-size:22px;font-weight:600;margin-top:2px;white-space:nowrap}
.kpi .v small{font-size:12px;font-weight:500;color:var(--ink2);margin-right:2px}
.kpi.hl{background:var(--ink);color:var(--surface)}.kpi.hl .k,.kpi.hl .v small{color:color-mix(in srgb,var(--surface) 70%,transparent)}
.budget{margin-top:14px}
.budget .track{height:12px;border-radius:7px;background:var(--surface2);position:relative;overflow:hidden;margin:8px 0 6px}
.budget .fill{position:absolute;inset:0 auto 0 0;background:var(--mauve);border-radius:7px}
.budget.over .fill{background:var(--brick)}
.budget .pace{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.45}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:150px;margin-top:8px}
.months .m{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.months .b{width:100%;max-width:26px;border-radius:6px 6px 3px 3px;background:var(--mauve);min-height:2px;transition:height .6s cubic-bezier(.2,.8,.2,1)}
.months .b.zero{background:var(--line)}
.months .l{font-size:11px;color:var(--ink3);font-family:var(--num)}
.months .m.cur .l{color:var(--ink);font-weight:700}
.months .vv{font-size:10px;color:var(--ink2);font-family:var(--num);white-space:nowrap;height:13px}
.hbars .r{display:grid;grid-template-columns:5.4em 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.hbars .r .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbars .r .t{height:8px;border-radius:5px;background:var(--surface2);position:relative;overflow:hidden}
.hbars .r .t i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--sage)}
.hbars .r .v{font-family:var(--num);font-size:13.5px;text-align:right;white-space:nowrap}
.list .li{display:flex;align-items:center;gap:12px;padding:9px 0;width:100%;text-align:left}
.list .li+.li{border-top:1px solid var(--line)}
.list .li .th{width:42px;height:56px;flex:none}
.list .li .th .ph{border-radius:8px;aspect-ratio:auto;height:100%}
.list .li .tx{flex:1;min-width:0}
.list .li .tx div:first-child{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .li .rv{font-family:var(--num);text-align:right;white-space:nowrap}

/* 設定 */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0}
.setrow+.setrow{border-top:1px solid var(--line)}
.setrow .lbl{font-weight:500}
.setrow .desc{font-size:12.5px;color:var(--ink2)}
.cated{display:grid;grid-template-columns:1fr 4.6em auto;gap:6px;align-items:center;padding:6px 0}
.cated input.nm{height:38px}
.cated input.lim{height:38px;text-align:center}
.cated .ops{display:flex;gap:2px}
.cated .ops button{width:32px;height:32px;border-radius:9px;color:var(--ink2);display:grid;place-items:center}
.cated .ops button:hover{background:var(--surface2)}
.cated .ops svg{width:16px;height:16px}
.cated .idle-t{grid-column:1/-1;font-size:12.5px;color:var(--ink2);display:flex;gap:8px;align-items:center;margin-top:-2px;cursor:pointer}
.cated .idle-t input{width:18px;height:18px;padding:0;margin:0;flex:none;border-radius:4px;box-shadow:none;background:none;accent-color:var(--mauve)}
.tips{margin:0;padding-left:20px}.tips li{margin:6px 0}
.rt{width:100%;border-collapse:collapse;font-size:13.5px}
.rt td{padding:6px 4px;border-top:1px solid var(--line)}
.rt td.v{font-family:var(--num);color:var(--ink2)}
.rt input{width:96px;height:34px;text-align:right}

/* 表單 */
label.f{display:block;margin-bottom:14px}
label.f>span,.flabel{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px;letter-spacing:.03em}
.flabel .req{color:var(--brick);margin-left:2px}
input.in,select.in,textarea.in,.cated input,.rt input{width:100%;height:44px;border-radius:12px;border:0;background:var(--surface2);padding:0 12px;font-size:16px;outline:none;box-shadow:inset 0 0 0 1px transparent;transition:box-shadow .15s}
textarea.in{height:auto;min-height:72px;padding:10px 12px;resize:vertical}
input.in:focus,select.in:focus,textarea.in:focus,.cated input:focus,.rt input:focus{box-shadow:inset 0 0 0 2px var(--mauve)}
input.in.err,select.in.err{box-shadow:inset 0 0 0 2px var(--brick)}
select.in{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input[type=date].in{display:block;-webkit-appearance:none;appearance:none;min-height:44px;line-height:44px}
.ferr{color:var(--brick);font-size:13px;margin-top:6px;font-weight:600}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow3{display:grid;grid-template-columns:8.6em 1fr 1fr;gap:10px}.frow3.twd{grid-template-columns:8.6em 1fr}
.fsec{border-top:1px solid var(--line);padding-top:14px;margin-top:4px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick .chip{height:34px}
.pickgrp{margin-bottom:8px}
.pickgrp .g{font-size:12px;color:var(--ink3);margin:0 0 4px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{display:flex;flex-direction:column;align-items:center;gap:3px;width:44px;font-size:11.5px;color:var(--ink2)}
.swatch i{width:32px;height:32px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(128,128,128,.35);position:relative;transition:transform .15s}
.swatch.on i{transform:scale(1.05);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.swatch.on{color:var(--ink);font-weight:700}
.autocol{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;background:var(--sage-soft);border-radius:12px;padding:8px 12px;margin:-2px 0 12px}
.autocol .ac{display:inline-flex;align-items:center;gap:5px;font-weight:700}
.autocol .ac i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4)}

.batchlink{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--mauve-soft);color:var(--mauve-ink);border-radius:14px;padding:10px 12px;margin:0 0 14px;font-size:13.5px;line-height:1.4}

.stepper input{width:44px;text-align:center;border:0;background:none;font-size:16px;outline:none;font-family:var(--num)}

/* 底部動作條 */
.selbar{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + var(--safe-b) + 10px);z-index:31;background:var(--ink);color:var(--surface);border-radius:18px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow);transform:translateY(20px);opacity:0;pointer-events:none;transition:.22s}

/* Sheet */

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
'use strict';
const APP_VERSION = '1.2.1';

/* ---------- 基本資料 ---------- */
const BASE_COLORS = [
  ['black','黑','#2E2C2B'],['white','白','#F7F6F2'],['grey','灰','#A09D99'],['beige','米','#E4DACA'],['khaki','卡其','#BFA98A'],
  ['brown','咖啡','#7A5A45'],['navy','深藍','#2F3A56'],['blue','藍','#5B7FA8'],['lightblue','淺藍','#A9C3DC'],['green','綠','#6F8F6A'],
  ['olive','軍綠','#6B6A45'],['red','紅','#B0413E'],['wine','酒紅','#6E2F3A'],['pink','粉','#E3B5B8'],['purple','紫','#8A76A0'],
  ['yellow','黃','#E2C766'],['orange','橘','#D98C4A'],['multi','花色','multi']
];
let COLORS = BASE_COLORS.slice(), COLOR = Object.fromEntries(BASE_COLORS.map(([k,n,h])=>[k,{k,n,h}]));
function rebuildColors(){ COLORS=[...BASE_COLORS,...((S.settings&&S.settings.customColors)||[]).map(c=>[c.k,c.n,c.h])]; COLOR=Object.fromEntries(COLORS.map(([k,n,h])=>[k,{k,n,h}])); }
const MULTI_BG = 'conic-gradient(#B0413E 0 25%,#E2C766 0 50%,#6F8F6A 0 75%,#5B7FA8 0)';
const swBg = k => !COLOR[k] ? 'var(--line)' : (COLOR[k].h==='multi' ? MULTI_BG : COLOR[k].h);
const SEASONS = ['春','夏','秋','冬'];
const CURRENCIES = [['TWD','台幣'],['JPY','日圓'],['KRW','韓元'],['USD','美元'],['EUR','歐元'],['GBP','英鎊'],['HKD','港幣'],['CNY','人民幣'],['THB','泰銖'],['SGD','星幣'],['AUD','澳幣'],['VND','越南盾']];
const CUR_SYMBOL = {TWD:'NT$',JPY:'¥',KRW:'₩',USD:'US$',EUR:'€',GBP:'£',HKD:'HK$',CNY:'CN¥',THB:'฿',SGD:'S$',AUD:'A$',VND:'₫'};
const METHODS = [['trash','丟棄'],['donate','捐回收箱'],['gift','送人'],['sold','賣掉'],['lost','遺失']];
const METHOD = Object.fromEntries(METHODS);
const DEFAULT_GROUPS = ['上衣','下身','貼身衣物','居家','配件','鞋子'];
const DEFAULT_CATS = [
  ['shirt','襯衫','上衣'],['jacket','外套','上衣'],['ls_tee','長袖T','上衣'],['ss_tee','短袖T','上衣'],['hoodie','帽T','上衣'],['sweater','毛衣','上衣'],
  ['bottom','下衣','下身'],
  ['bra','內衣','貼身衣物',false],['panties','內褲','貼身衣物',false],['heattech','發熱衣','貼身衣物',false],['cool','涼感衣','貼身衣物',false],['socks','襪子','貼身衣物',false],
  ['pj_top','睡衣','居家',false],['pj_bottom','睡褲','居家',false],
  ['hat','帽子','配件'],['scarf','圍巾','配件'],['sleeve','袖套','配件'],
  ['shoes','鞋子','鞋子']
].map(([id,name,group,idle],i)=>({id,name,group,limit:null,idle:idle!==false,order:i}));
const DEFAULT_LOCATIONS = ['衣櫃','抽屜','收納箱','鞋櫃'];
const DEFAULT_CHANNELS = ['實體店','網購','二手','別人送的'];

/* ---------- 小工具 ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parseYmd = s => { if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const daysSince = s => { const d=parseYmd(s); if(!d) return null; const t=parseYmd(today()); return Math.round((t-d)/864e5); };
const fmtDate = s => { if(!s) return '日期不詳'; const [y,m,d]=s.split('-'); return `${y}/${+m}/${+d}`; };
const fmtInt = n => Math.round(n).toLocaleString('zh-TW');
const money = (n,cur='TWD') => n==null||isNaN(n) ? '—' : (CUR_SYMBOL[cur]||cur+' ')+(cur==='TWD'||cur==='JPY'||cur==='KRW'||cur==='VND'?fmtInt(n):(+n).toLocaleString('zh-TW',{maximumFractionDigits:2}));
const parseNum = v => { if(v==null) return null; const s=String(v).replace(/[,\s，]/g,'').replace(/[０-９．]/g,c=>c==='．'?'.':String.fromCharCode(c.charCodeAt(0)-0xFEE0)); if(s==='') return null; const n=Number(s); return isFinite(n)?n:NaN; };
const normKey = s => String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const ICON = {
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>',
  filter:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>',
  select:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5C4 7.7 4.7 7 5.5 7h2l1.5-2h6l1.5 2h2c.8 0 1.5.7 1.5 1.5v9c0 .8-.7 1.5-1.5 1.5h-13C4.7 19 4 18.3 4 17.5v-9Z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 14 6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 10 6 6 6-6"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 7h14M10 11v6M14 11v6M7 7l1 12h8l1-12M9.5 7V4.5h5V7"/></svg>',
  hanger:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5a1.8 1.8 0 1 1 1.8-1.8c0 .9-.6 1.2-1.1 1.6-.4.3-.7.6-.7 1.2v.3M12 7.8 3.4 14.2c-.7.5-.3 1.6.5 1.6h16.2c.8 0 1.2-1.1.5-1.6L12 7.8Z"/></svg>'
};

/* ---------- IndexedDB ---------- */
const DB = {
  db:null,
  open(){ return new Promise((res,rej)=>{
    const r=indexedDB.open('closet-ledger',1);
    r.onupgradeneeded=()=>{ const d=r.result;
      if(!d.objectStoreNames.contains('items')) d.createObjectStore('items',{keyPath:'id'});
      if(!d.objectStoreNames.contains('images')) d.createObjectStore('images',{keyPath:'id'});
      if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta',{keyPath:'key'}); };
    r.onsuccess=()=>{ this.db=r.result; res(); };
    r.onerror=()=>rej(r.error); r.onblocked=()=>rej(new Error('blocked'));
  });},
  tx(store,mode,fn){ return new Promise((res,rej)=>{
    const t=this.db.transaction(store,mode); const s=t.objectStore(store); let out;
    const r=fn(s); if(r) r.onsuccess=()=>{ out=r.result; };
    t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error||new Error('abort'));
  });},
  get(s,k){ return this.tx(s,'readonly',st=>st.get(k)); },
  getAll(s){ return this.tx(s,'readonly',st=>st.getAll()); },
  put(s,v){ return this.tx(s,'readwrite',st=>st.put(v)); },
  putMany(s,arr){ return new Promise((res,rej)=>{ const t=this.db.transaction(s,'readwrite'); const st=t.objectStore(s); arr.forEach(v=>st.put(v)); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error||new Error('abort')); }); },
  del(s,k){ return this.tx(s,'readwrite',st=>st.delete(k)); },
  clear(s){ return this.tx(s,'readwrite',st=>st.clear()); }
};

/* ---------- 狀態 ---------- */
const S = {
  items:[], settings:null, rates:null, view:'closet',
  f:{status:'own',q:'',cats:[],colors:[],brands:[],stores:[],seasons:[],locations:[],sort:'new'},
  selecting:false, sel:new Set(), railAnimated:false
};
function defaultSettings(){ return {groups:[...DEFAULT_GROUPS],cats:DEFAULT_CATS.map(c=>({...c})),budget:null,idleDays:365,manualRates:{},lastBackup:null,firstUse:Date.now(),lastCheckAt:null,theme:'auto',customColors:[],channels:[...DEFAULT_CHANNELS]}; }
async function saveSettings(){ await DB.put('meta',{key:'settings',value:S.settings}); }
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

/* ---------- 衍生資料 ---------- */
const cats = () => [...S.settings.cats].sort((a,b)=>a.order-b.order);
const catById = id => S.settings.cats.find(c=>c.id===id);
const catName = id => catById(id)?.name || '未分類';
const owned = it => it.status==='active' || it.status==='selling';
const ownedItems = () => S.items.filter(owned);
const qtyOf = it => Math.max(1, it.qty||1);
const sumQty = arr => arr.reduce((s,it)=>s+qtyOf(it),0);
const itemName = it => it.name?.trim() || `${it.colors?.[0]&&COLOR[it.colors[0]]?COLOR[it.colors[0]].n+'色':''}${catName(it.cat)}`;
const wearCount = it => (it.wears||[]).length;
const lastWear = it => (it.wears||[]).reduce((m,d)=>d>m?d:m,'');
function idleSince(it){ // 從哪一天開始算「沒穿」：最後穿著、購入日、開始建檔日 取最晚
  const tracked = ymd(new Date(it.createdAt||Date.now()));
  return [lastWear(it), it.date||'', tracked].reduce((m,d)=>d>m?d:m,'');
}
function isIdle(it){ if(!owned(it)) return false; const c=catById(it.cat); if(c && c.idle===false) return false; return daysSince(idleSince(it)) >= (S.settings.idleDays||365); }
const cpw = it => it.price==null ? null : it.price / Math.max(1, wearCount(it));
function brandDisplayMap(field){ // 不分大小寫合併，顯示最常用的寫法
  const m=new Map();

function matchItem(it,f,skip={}){
  if(f.status==='own' && !owned(it)) return false;
  if(f.status==='selling' && it.status!=='selling') return false;
  if(f.status==='retired' && it.status!=='retired') return false;
  if(f.q){ const q=normKey(f.q); const hay=normKey([itemName(it),it.brand,it.store,it.note,catName(it.cat),it.size,it.location,(it.colors||[]).map(c=>COLOR[c]?.n).join(' ')].join(' ')); if(!q.split(' ').every(w=>hay.includes(w))) return false; }
  if(f.cats.length && !f.cats.includes(it.cat)) return false;
  if(!skip.colors && f.colors.length && !(it.colors||[]).some(c=>f.colors.includes(c))) return false;
  if(f.brands.length && !f.brands.includes(normKey(it.brand))) return false;
  if(f.stores.length && !f.stores.includes(normKey(it.store))) return false;
  if(f.seasons.length && !(it.seasons||[]).some(s=>f.seasons.includes(s))) return false;
  if(f.locations.length && !f.locations.includes(normKey(it.location))) return false;
  return true;
}
const SORTS = [['new','最新購入'],['old','最早購入'],['priceDesc','價格高→低'],['priceAsc','價格低→高'],['wearDesc','穿最多次'],['idle','最久沒穿'],['cpwDesc','每次成本最高']];
function sortItems(arr,key){
  const by = {
    new:(a,b)=>(b.date||'').localeCompare(a.date||'')||b.createdAt-a.createdAt,
    old:(a,b)=>(a.date||'9999').localeCompare(b.date||'9999')||a.createdAt-b.createdAt,
    priceDesc:(a,b)=>(b.price??-1)-(a.price??-1),
    priceAsc:(a,b)=>(a.price??1e15)-(b.price??1e15),
    wearDesc:(a,b)=>wearCount(b)-wearCount(a),
    idle:(a,b)=>idleSince(a).localeCompare(idleSince(b)),
    cpwDesc:(a,b)=>(cpw(b)??-1)-(cpw(a)??-1)
  }[key]||(()=>0);
  return [...arr].sort(by);
}

const urlCache = new Map();
async function imgURL(id,kind='thumb'){
  const key=id+':'+kind; if(urlCache.has(key)) return urlCache.get(key);
  const rec=await DB.get('images',id); if(!rec) return null;
  const part=rec[kind]||rec.full; const url=URL.createObjectURL(new Blob([part.buf],{type:part.type}));
  urlCache.set(key,url); return url;
}
function dropImgCache(id){ ['thumb','full'].forEach(k=>{ const u=urlCache.get(id+':'+k); if(u){ URL.revokeObjectURL(u); urlCache.delete(id+':'+k);} }); }
function loadImage(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error('decode')); im.src=src; }); }
function canvasToBuf(cv,q){ return new Promise((res,rej)=>cv.toBlob(b=>{ if(!b) return rej(new Error('encode')); b.arrayBuffer().then(buf=>res({buf,type:'image/jpeg'}),rej); },'image/jpeg',q)); }
async function encode(im,max,q){
  const w=im.naturalWidth,h=im.naturalHeight; const s=Math.min(1,max/Math.max(w,h));
  const cv=document.createElement('canvas'); cv.width=Math.max(1,Math.round(w*s)); cv.height=Math.max(1,Math.round(h*s));
  const cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(im,0,0,cv.width,cv.height);
  const out=await canvasToBuf(cv,q); cv.width=cv.height=0; return out;
}
async function processImage(file){
  const url=URL.createObjectURL(file);
  try{
    let im; try{ im=await loadImage(url); }catch(e){
      const heic=/heic|heif/i.test(file.type)||/\.hei[cf]$/i.test(file.name||'');
      throw new Error(heic?'這張照片是 HEIC 格式，這個瀏覽器讀不了。請改用 JPG／PNG，或在 iPhone 上直接從 App 選照片。':'這個檔案無法當作照片讀取，請換一張 JPG 或 PNG。');
    }
    const full=await encode(im,1400,.84); const thumb=await encode(im,520,.8);
    return {full,thumb};
  } finally { URL.revokeObjectURL(url); }
}
async function deleteImageIfUnused(imgId){
  if(!imgId) return; if(S.items.some(it=>it.photo===imgId)) return;
  await DB.del('images',imgId); dropImgCache(imgId);
}
let io=null;
function hydrateImages(root=document){
  if(!io) io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ io.unobserve(e.target); fillImg(e.target); } }),{rootMargin:'300px'});
  $$('img[data-img]:not([data-done])',root).forEach(im=>{ im.dataset.done='1'; if(urlCache.has(im.dataset.img+':'+(im.dataset.kind||'thumb'))) fillImg(im); else io.observe(im); });
}
async function fillImg(im){ try{ const u=await imgURL(im.dataset.img,im.dataset.kind||'thumb'); if(u){ im.onload=()=>im.classList.add('ok'); im.src=u; if(im.complete) im.classList.add('ok'); } }catch(e){} }
function lum(hex){ if(!hex||hex==='multi') return .5; const n=parseInt(hex.slice(1),16); const r=(n>>16)/255,g=(n>>8&255)/255,b=(n&255)/255; return .2126*r+.7152*g+.0722*b; }
function photoHTML(it,kind='thumb'){

}

  navy:['#2F3A56','#1F2A44','#232B3E','#2C3A63'], blue:['#5B7FA8','#3C5F9A','#4A6A90','#2E5C9C','#6E8DB4'], lightblue:['#A9C3DC','#9BB8D8','#BCD2E8','#8FAED0'],
  green:['#6F8F6A','#3F7F4F','#2E6B3E','#8FB08A','#4E7654'], olive:['#6B6A45','#5A5A3A','#706B4A','#7C7A50','#55553A'],
  red:['#B0413E','#C0392B','#A82A2A','#D04040','#B02830'], wine:['#6E2F3A','#5E1F2A','#7A2F3F','#56222C','#64222E'],

};
function hex2rgb(h){ const n=parseInt(h.slice(1),16); return [n>>16,n>>8&255,n&255]; }
const _lin=c=>{ c/=255; return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4); };
function rgb2lab(r,g,b){ const R=_lin(r),G=_lin(g),B=_lin(b);
  const x=(R*.4124+G*.3576+B*.1805)/.95047, y=R*.2126+G*.7152+B*.0722, z=(R*.0193+G*.1192+B*.9505)/1.08883;
  const f=t=>t>0.008856?Math.cbrt(t):7.787*t+16/116; const fx=f(x),fy=f(y),fz=f(z); return [116*fy-16,500*(fx-fy),200*(fy-fz)]; }
function dE(a,b,kL=1){ const dL=(a[0]-b[0])/kL, c1=Math.hypot(a[1],a[2]), c2=Math.hypot(b[1],b[2]), dC=c1-c2, da=a[1]-b[1], db=a[2]-b[2];
  const dH2=Math.max(0,da*da+db*db-dC*dC), sC=1+0.045*c1, sH=1+0.015*c1; return Math.sqrt(dL*dL+(dC/sC)**2+dH2/(sH*sH)); }
function anchorList(){ const out=[]; Object.entries(ANCHORS).forEach(([k,arr])=>arr.forEach(h=>out.push([k,rgb2lab(...hex2rgb(h))])));
  (S.settings.customColors||[]).forEach(c=>{ if(/^#[0-9a-f]{6}$/i.test(c.h)) out.push([c.k,rgb2lab(...hex2rgb(c.h)),true]); }); return out; }
function nearestKey(lab,anchors){ let best=null,bd=1e9; for(const [k,a,custom] of anchors){ const d=dE(lab,a,1.6)-(custom?1.5:0); if(d<bd){ bd=d; best=k; } } return best; }
function kmeans(px,wt,k,iters=10){ // px: Float32Array [L,a,b]*n
  const n=wt.length; if(!n) return []; let seed=12345; const rnd=()=>((seed=(seed*1103515245+12345)&0x7fffffff)/0x7fffffff);
  const C=[]; const first=Math.floor(rnd()*n); C.push([px[first*3],px[first*3+1],px[first*3+2]]);
  const d2=new Float32Array(n).fill(1e9);
  while(C.length<k){ const c=C[C.length-1]; let sum=0; for(let i=0;i<n;i++){ const dl=px[i*3]-c[0],da=px[i*3+1]-c[1],db=px[i*3+2]-c[2]; const d=dl*dl+da*da+db*db; if(d<d2[i]) d2[i]=d; sum+=d2[i]*wt[i]; }
    if(sum<=0) break; let r=rnd()*sum, j=0; for(;j<n;j++){ r-=d2[j]*wt[j]; if(r<=0) break; } j=Math.min(j,n-1); C.push([px[j*3],px[j*3+1],px[j*3+2]]); }
  const as=new Int32Array(n);
  for(let it=0;it<iters;it++){
    for(let i=0;i<n;i++){ let b=0,bd=1e18; for(let c=0;c<C.length;c++){ const dl=px[i*3]-C[c][0],da=px[i*3+1]-C[c][1],db=px[i*3+2]-C[c][2]; const d=dl*dl+da*da+db*db; if(d<bd){bd=d;b=c;} } as[i]=b; }
    const acc=C.map(()=>[0,0,0,0]); for(let i=0;i<n;i++){ const a=acc[as[i]]; a[0]+=px[i*3]*wt[i]; a[1]+=px[i*3+1]*wt[i]; a[2]+=px[i*3+2]*wt[i]; a[3]+=wt[i]; }
    acc.forEach((a,c)=>{ if(a[3]>0) C[c]=[a[0]/a[3],a[1]/a[3],a[2]/a[3]]; });
  }
  const tot=wt.reduce((s,v)=>s+v,0); const sh=C.map(()=>0), cnt=C.map(()=>0); for(let i=0;i<n;i++){ sh[as[i]]+=wt[i]; cnt[as[i]]++; }
  return C.map((c,i)=>({lab:c,share:tot?sh[i]/tot:0,ushare:cnt[i]/n})).filter(c=>c.share>0);
}
async function detectColors(src){
  const im=await loadImage(src); const N=96; const s=Math.min(1,N/Math.max(im.naturalWidth,im.naturalHeight));
  const w=Math.max(8,Math.round(im.naturalWidth*s)), h=Math.max(8,Math.round(im.naturalHeight*s));
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const cx=cv.getContext('2d',{willReadFrequently:true}); cx.drawImage(im,0,0,w,h);
  const d=cx.getImageData(0,0,w,h).data; cv.width=cv.height=0;
  const all=[]; let hasAlpha=false;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const i=(y*w+x)*4; if(d[i+3]<128){ hasAlpha=true; continue; }
    all.push({lab:rgb2lab(d[i],d[i+1],d[i+2]),x:x/(w-1),y:y/(h-1)}); }
  if(all.length<20) return [];
  // 1) 找背景：邊框常見、但中央少見的顏色
  let bgs=[];
  if(!hasAlpha){
    const bm=0.06, isBorder=p=>p.x<bm||p.x>1-bm||p.y<bm||p.y>1-bm, isCenter=p=>p.x>.3&&p.x<.7&&p.y>.3&&p.y<.7;
    const border=all.filter(isBorder), center=all.filter(isCenter);
    const bpx=new Float32Array(border.length*3); border.forEach((p,i)=>{ bpx[i*3]=p.lab[0]; bpx[i*3+1]=p.lab[1]; bpx[i*3+2]=p.lab[2]; });
    const bcl=kmeans(bpx,new Float32Array(border.length).fill(1),3);
    const frac=(arr,lab)=>arr.filter(p=>dE(p.lab,lab)<14).length/Math.max(1,arr.length);
    bgs=bcl.filter(c=>c.share>=0.15).map(c=>({lab:c.lab,b:frac(border,c.lab),c:frac(center,c.lab)})).filter(o=>o.c<o.b*0.6).map(o=>o.lab);
  }
  // 2) 衣服的像素（中央權重較高）
  const keep=[], wt=[];
  const push=(p)=>{ const dx=p.x-.5, dy=p.y-.5; keep.push(p.lab); wt.push(0.3+Math.exp(-(dx*dx+dy*dy)/(2*.3*.3))); };
  all.forEach(p=>{ if(!bgs.some(b=>dE(p.lab,b)<16)) push(p); });
  if(keep.length<all.length*0.08){ keep.length=0; wt.length=0; all.forEach(push); }
  const px=new Float32Array(keep.length*3); keep.forEach((l,i)=>{ px[i*3]=l[0]; px[i*3+1]=l[1]; px[i*3+2]=l[2]; });
  const cl=kmeans(px,Float32Array.from(wt),5);
  // 3) 對應到色票並合併（同一件衣服的亮部與陰影會合併成同一色）
  const anchors=anchorList(); const agg=new Map();
  cl.forEach(c=>{ const k=nearestKey(c.lab,anchors); const o=agg.get(k)||{k,share:0,ushare:0,L:0}; o.L=(o.L*o.share+c.lab[0]*c.share)/(o.share+c.share); o.share+=c.share; o.ushare+=c.ushare; agg.set(k,o); });
  return [...agg.values()].sort((a,b)=>b.share-a.share);
}
function pickColors(res){
  if(!res.length) return [];
  const sig=res.filter(r=>r.share>=0.1);
  if(sig.length>=4) return ['multi',res[0].k];
  const p=res[0]; const out=[p.k];
  // 第二、三色要夠大塊；陰影容易被看成「灰」、亮部容易被看成「白」，門檻較高
  for(const r of res.slice(1,4)){ if(out.length>=3) break;
    let need = out.length===1 ? 0.2 : 0.22;
    if(r.k==='grey' && p.k!=='grey') need=0.36;
    if(r.k==='white' && p.k!=='white' && p.L>62) need=0.32;
    if(r.k==='black' && p.k!=='black' && p.L<35) need=0.32;
    if(r.share>=need && r.ushare>=need) out.push(r.k);
  }
  return out.filter(k=>COLOR[k]).slice(0,3);
}

async function refreshRates(force){
  const R=S.rates; if(!force && R && Date.now()-R.fetched<12*3600e3) return false;
  if(!navigator.onLine && !force) return false;
  try{
    const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),8000);
    const res=await fetch('https://open.er-api.com/v6/latest/TWD',{signal:ctl.signal,cache:'no-store'}); clearTimeout(t);
    const j=await res.json(); if(j.result!=='success'||!j.rates) throw new Error('bad');
    S.rates={rates:j.rates,updated:(j.time_last_update_unix||0)*1000||Date.now(),fetched:Date.now()};
    await DB.put('meta',{key:'rates',value:S.rates}); return true;
  }catch(e){ if(force) throw e; return false; }
}

const sheets=[];
function openSheet({title,body,foot,wide,onClose}){
  const w=document.createElement('div'); w.className='sw-wrap';
  w.innerHTML=`<div class="scrim"></div><div class="sheet${wide?' wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grabber"></div><div class="sh-h"><h3>${esc(title)}</h3><button class="iconbtn" data-close aria-label="關閉">${ICON.close}</button></div><div class="sh-b">${body}</div>${foot?`<div class="sh-f">${foot}</div>`:''}</div>`;
  document.body.appendChild(w); document.body.classList.add('locked');
  w.close=()=>{ if(w.closing) return; w.closing=true; w.classList.remove('in'); const i=sheets.indexOf(w); if(i>=0) sheets.splice(i,1); if(!sheets.length) document.body.classList.remove('locked'); setTimeout(()=>w.remove(),340); onClose&&onClose(); };
  w.setTitle=t=>{ w.querySelector('.sh-h h3').textContent=t; };
  w.querySelector('.scrim').onclick=()=>w.close(); w.querySelector('[data-close]').onclick=()=>w.close();
  sheets.push(w); requestAnimationFrame(()=>requestAnimationFrame(()=>w.classList.add('in')));
  hydrateImages(w); return w;
}
function confirmSheet({title,msg,ok='確定',danger,cancel='取消'}){
  return new Promise(res=>{ let done=false;
    const w=openSheet({title,body:`<p style="margin:4px 0 6px;font-size:15px">${msg}</p>`,foot:`<button class="btn" data-no>${esc(cancel)}</button><button class="btn ${danger?'danger':'pri'}" data-ok>${esc(ok)}</button>`,onClose:()=>{ if(!done) res(false); }});
    w.querySelector('[data-no]').onclick=()=>{ w.close(); };
    w.querySelector('[data-ok]').onclick=()=>{ done=true; w.close(); res(true); };
  });
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && sheets.length){ sheets[sheets.length-1].close(); } });

function railHTML(base){
  const counts=new Map(); base.forEach(it=>{ const k=it.colors?.[0]; if(k) counts.set(k,(counts.get(k)||0)+qtyOf(it)); });

  const sel=S.f.colors;
  return `<div class="rail${sel.length?' has-sel':''}${!S.railAnimated?' anim':''}" aria-label="衣櫥色譜：依主色統計">

}
function activeFilterChips(){

function longestGap(){
  const ds=[...new Set(S.items.map(i=>i.date).filter(Boolean))].sort(); if(!ds.length) return 0;
  let best=0; for(let i=1;i<ds.length;i++) best=Math.max(best,Math.round((parseYmd(ds[i])-parseYmd(ds[i-1]))/864e5));
  return Math.max(best,daysSince(ds[ds.length-1]));
}

function bindCatEditor(){
  $$('#sec-cats .cated[data-c]').forEach(row=>{ const c=catById(row.dataset.c);
    row.querySelector('[data-f=name]').onchange=async e=>{ const v=e.target.value.trim(); if(!v){ e.target.value=c.name; toast('分類名稱不能空白'); return; } if(S.settings.cats.some(x=>x!==c&&x.name===v)){ e.target.value=c.name; toast('已經有同名的分類'); return; } c.name=v; await saveSettings(); toast('已改名'); };
    row.querySelector('[data-f=limit]').onchange=async e=>{ const v=parseNum(e.target.value); if(v!=null&&(isNaN(v)||v<1||!Number.isInteger(v))){ e.target.classList.add('err'); toast('上限請填 1 以上的整數，或留空'); return; } e.target.classList.remove('err'); c.limit=v||null; await saveSettings(); toast(v?`${c.name} 上限 ${v} 件`:`${c.name} 不設上限`); };
    row.querySelector('[data-f=idle]').onchange=async e=>{ c.idle=e.target.checked; await saveSettings(); };
  });
}

async function addCategory(group){
  const st=S.settings; const name=await askText(`在「${group}」新增分類`,'分類名稱','');
  if(!name) return null; if(st.cats.some(c=>c.name===name)){ toast('已經有「'+name+'」這個分類了'); return null; }
  const c={id:'c_'+uid(),name,group,limit:null,idle:true,order:Math.max(0,...st.cats.map(c=>c.order))+1};
  st.cats.push(c); await saveSettings(); toast('已新增分類「'+name+'」'); return c.id;
}
async function addGroup(withCat){
  const st=S.settings; const g=await askText('新增大類','大類名稱（例如：洋裝、運動服、包包）','');
  if(!g) return null; if(st.groups.includes(g)){ toast('已經有「'+g+'」這個大類了'); return null; }
  if(!withCat){ st.groups.push(g); await saveSettings(); toast('已新增大類「'+g+'」，記得在裡面新增分類'); return null; }
  const name=await askText(`「${g}」裡的第一個分類`,'分類名稱',g);
  if(!name) return null; if(st.cats.some(c=>c.name===name)){ toast('已經有「'+name+'」這個分類了'); return null; }
  st.groups.push(g); const c={id:'c_'+uid(),name,group:g,limit:null,idle:true,order:Math.max(0,...st.cats.map(c=>c.order))+1};
  st.cats.push(c); await saveSettings(); toast('已新增「'+g+'」與分類「'+name+'」'); return c.id;
}
function colorSheet(c){
  return new Promise(res=>{ let done=false;
    const w=openSheet({title:c?'編輯顏色':'新增自訂顏色',body:`<div style="display:flex;gap:16px;align-items:flex-end;margin-bottom:6px">
      <label style="text-align:center;font-size:12px;color:var(--ink2)"><input type="color" class="cpick" id="ccH" value="${c?.h||'#B8A398'}"><div style="margin-top:4px">點圓圈選色</div></label>
      <label class="f" style="flex:1;margin:0"><span>顏色名稱</span><input class="in" id="ccN" value="${esc(c?.n||'')}" placeholder="例如：奶茶、霧粉、焦糖" autocomplete="off"></label></div>
      <div class="ferr hide" id="ccE"></div>`,foot:'<button class="btn" data-c>取消</button><button class="btn pri" data-ok>'+(c?'儲存':'新增')+'</button>',onClose:()=>{ if(!done) res(null); }});
    const n=$('#ccN',w); setTimeout(()=>n.focus(),350);
    const ok=()=>{ const name=n.value.trim(); const e=$('#ccE',w);
      if(!name){ e.textContent='請輸入顏色名稱'; e.classList.remove('hide'); n.classList.add('err'); return; }
      if(COLORS.some(([k,nm])=>nm===name && k!==c?.k)){ e.textContent='已經有「'+name+'」這個顏色了'; e.classList.remove('hide'); n.classList.add('err'); return; }
      done=true; w.close(); res({n:name,h:$('#ccH',w).value.toUpperCase()}); };
    w.querySelector('[data-ok]').onclick=ok; n.onkeydown=e=>{ if(e.key==='Enter') ok(); }; n.oninput=()=>{ $('#ccE',w).classList.add('hide'); n.classList.remove('err'); }; w.querySelector('[data-c]').onclick=()=>w.close();
  });
}

    <label class="f"><span>備註</span><textarea class="in" id="fNote" rows="2">${esc(it.note)}</textarea></label>
    </div>
  </div></div>
  <datalist id="dlBrand">${brands.map(b=>`<option value="${esc(b)}">`).join('')}</datalist>
  <datalist id="dlStore">${stores.map(b=>`<option value="${esc(b)}">`).join('')}</datalist>
  <datalist id="dlLoc">${locs.map(b=>`<option value="${esc(b)}">`).join('')}</datalist>`;
  const foot = batch
    ? `<button class="btn" data-skip>略過這張</button><button class="btn pri grow2" data-save>${batch.index===batch.files.length-1?'儲存並完成':'儲存，下一張'}</button>`
    : isNew ? `<button class="btn soft" data-again>儲存，再加一件</button><button class="btn pri" data-save>儲存</button>`
            : `<button class="btn danger" data-del aria-label="刪除">${ICON.trash}</button><button class="btn" data-cancel>取消</button><button class="btn pri grow2" data-save>儲存</button>`;
  const w=openSheet({title,body,foot,wide:true,onClose:()=>{ if(photoPreview) URL.revokeObjectURL(photoPreview); document.removeEventListener('paste',onPaste); }});
  const B=w.querySelector('.sh-b');

  // 照片
  const box=$('#fPhoto',w);
  async function drawPhoto(){
    if(photoPreview){ box.classList.add('has'); box.innerHTML=`<img src="${photoPreview}" alt=""><span class="rm" data-rmph aria-label="移除照片">${ICON.close.replace('<svg','<svg width="16" height="16"')}</span><span class="chg">換一張</span>`; }
    else if(it.photo && !removePhoto){ box.classList.add('has'); const u=await imgURL(it.photo,'full'); box.innerHTML=`<img src="${u||''}" alt=""><span class="rm" data-rmph aria-label="移除照片">${ICON.close.replace('<svg','<svg width="16" height="16"')}</span><span class="chg">換一張</span>`; }
    else { box.classList.remove('has'); box.innerHTML=`<span class="hint">${ICON.camera}拍照或選照片<br><span class="faint small">可以不放照片</span></span>`; }
  }
  function setFile(file){ if(!file) return; if(file.type && !file.type.startsWith('image/') && !/\.hei[cf]$/i.test(file.name)){ toast('請選擇照片檔'); return; } photoFile=file; if(photoPreview) URL.revokeObjectURL(photoPreview); photoPreview=URL.createObjectURL(file); removePhoto=false; drawPhoto(); autoColor(photoPreview); }
  // 照片自動選色：還沒手動選顏色時直接選好；已經選了就只給建議
  let colorsTouched=!!(item && item.colors && item.colors.length), detectToken=0;
  const chipsOf=keys=>keys.map(k=>`<span class="ac"><i style="background:${swBg(k)}"></i>${esc(COLOR[k]?.n||'')}</span>`).join('');
  async function autoColor(src){
    const box=$('#fAuto',w); if(S.settings.autoColor===false){ box.classList.add('hide'); return; }
    const tk=++detectToken; box.classList.remove('hide'); box.innerHTML='<span class="muted">正在看照片的顏色…</span>';
    let keys=[]; try{ keys=pickColors(await detectColors(src)); }catch(e){ keys=[]; }
    if(tk!==detectToken || !w.isConnected) return;
    if(!keys.length){ box.innerHTML='<span class="muted">看不出照片的顏色，請手動選。</span>'; return; }
    if(!colorsTouched){ it.colors=keys.slice(); drawColors(); updateSimilar();
      box.innerHTML=`<span>已依照片選好</span>${chipsOf(keys)}<span class="muted">不對可以直接點選修改</span>`; }
    else { box.innerHTML=`<span>照片看起來是</span>${chipsOf(keys)}<button type="button" class="linkbtn" data-applyauto>套用</button>`;
      box.querySelector('[data-applyauto]').onclick=()=>{ it.colors=keys.slice(); drawColors(); updateSimilar(); box.innerHTML=`<span>已套用</span>${chipsOf(keys)}`; }; }
  }
  box.onclick=e=>{ if(e.target.closest('[data-rmph]')){ photoFile=null; if(photoPreview){URL.revokeObjectURL(photoPreview);photoPreview=null;} removePhoto=true; drawPhoto(); return; } const inp=$('#fileOne'); inp.value=''; inp.onchange=()=>setFile(inp.files[0]); inp.click(); };
  box.ondragover=e=>{ e.preventDefault(); box.classList.add('drag'); }; box.ondragleave=()=>box.classList.remove('drag');
  box.ondrop=e=>{ e.preventDefault(); box.classList.remove('drag'); setFile(e.dataTransfer.files[0]); };
  function onPaste(e){ if(sheets[sheets.length-1]!==w) return; const f=[...(e.clipboardData?.files||[])].find(f=>f.type.startsWith('image/')); if(f){ e.preventDefault(); setFile(f); toast('已貼上照片'); } }
  document.addEventListener('paste',onPaste);
  if(batch) setFile(batch.files[batch.index]); else drawPhoto();

  // 分類、顏色、季節
  const pickCat=id=>{ it.cat=id; $$('#fCats [data-cat]',w).forEach(x=>x.classList.toggle('on',x.dataset.cat===id)); $('#eCat',w).classList.add('hide'); updateSimilar(); };
  $('#fCats',w).onclick=async e=>{
    const add=e.target.closest('[data-addcat]'), grp=e.target.closest('[data-addgrp]'), b=e.target.closest('[data-cat]');
    if(add||grp){ const id= add? await addCategory(add.dataset.addcat) : await addGroup(true); if(id){ $('#fCats',w).innerHTML=catPickHTML(it.cat); pickCat(id); } return; }
    if(b) pickCat(b.dataset.cat); };
  const drawColors=()=>$$('#fColors .swatch',w).forEach(s=>{ const i=it.colors.indexOf(s.dataset.col); s.classList.toggle('on',i>=0); s.title=i===0?'主色':''; });
  $('#fColors',w).onclick=async e=>{
    if(e.target.closest('[data-addcol]')){ const k=await addCustomColor(); if(!k) return; $('#fColors',w).innerHTML=colorPickHTML(); if(it.colors.length<3) it.colors.push(k); else toast('已新增，但已選滿 3 個顏色'); drawColors(); updateSimilar(); return; }
    const b=e.target.closest('[data-col]'); if(!b) return; colorsTouched=true; detectToken++; $('#fAuto',w).classList.add('hide'); const k=b.dataset.col; const i=it.colors.indexOf(k); if(i>=0) it.colors.splice(i,1); else { if(it.colors.length>=3){ toast('最多選 3 個顏色'); return; } it.colors.push(k); } drawColors(); updateSimilar(); };
  drawColors();
  const fCh=$('#fChannel',w); let chPrev=fCh.value;
  fCh.onchange=async()=>{ if(fCh.value!=='__add'){ chPrev=fCh.value; return; } const v=await addChannel(); fCh.innerHTML=channelOptions(v||chPrev); fCh.value=v||chPrev; chPrev=fCh.value; };
  $('#fSeasons',w).onclick=e=>{ const b=e.target.closest('[data-se]'); if(!b) return; const s=b.dataset.se; it.seasons=it.seasons||[]; const i=it.seasons.indexOf(s); if(i>=0) it.seasons.splice(i,1); else it.seasons.push(s); b.classList.toggle('on',i<0); };
  function updateSimilar(){
    const el=$('#fSimilar',w); if(!it.cat){ el.classList.add('hide'); return; }
    const same=ownedItems().filter(x=>x.id!==it.id && x.cat===it.cat);
    const sameCol=it.colors[0]? same.filter(x=>(x.colors||[]).includes(it.colors[0])) : [];
    const c=catById(it.cat); const n=sumQty(same);
    if(!n){ el.classList.add('hide'); return; }
    const show=(sameCol.length?sameCol:same).slice(0,8);
    el.classList.remove('hide');
    el.innerHTML=`你已經有 <b class="num">${n}</b> 件${esc(c.name)}${sameCol.length?`，其中 <b class="num">${sumQty(sameCol)}</b> 件是${COLOR[it.colors[0]].n}色`:''}${c.limit?`（上限 ${c.limit}）`:''}。
      <div class="minis">${show.map(x=>`<div class="mini"><div class="ph">${photoHTML(x)}</div></div>`).join('')}</div>`;
    hydrateImages(el);
  }
  updateSimilar();

  // 價格
  const fCur=$('#fCur',w), fAmt=$('#fAmt',w), fTwd=$('#fTwd',w), fRate=$('#fRate',w), fQty=$('#fQty',w);
  function priceUI(){
    const cur=fCur.value; const foreign=cur!=='TWD';
    $$('.fx',w).forEach(x=>x.classList.toggle('hide',!foreign)); $('#fPriceRow',w).classList.toggle('twd',!foreign);
    $('#lAmt',w).textContent= foreign? `金額（${cur}）` : '金額（台幣）';
    const q=Math.max(1,parseInt(fQty.value)||1); const amt=parseNum(fAmt.value); const twd=foreign?parseNum(fTwd.value):amt;
    const parts=[]; if(q>1 && twd>0) parts.push(`${q} 件共 ${money(twd)}，平均每件 ${money(twd/q)}`);
    if(foreign && !fRate.value) parts.push(currentRate(cur)?'':'目前沒有這個幣別的匯率，請自己填匯率或台幣金額。');
    $('#fCalc',w).textContent=parts.filter(Boolean).join('　');
  }
  function recalcTwd(){ const a=parseNum(fAmt.value), r=parseNum(fRate.value); if(fCur.value!=='TWD' && a!=null && !isNaN(a) && r) fTwd.value=Math.round(a*r); else if(a==null) fTwd.value=''; priceUI(); }
  fCur.onchange=()=>{ const cur=fCur.value; if(cur!=='TWD'){ const r=currentRate(cur); fRate.value=r?+r.toPrecision(5):''; recalcTwd(); } else { fRate.value=''; fTwd.value=''; } priceUI(); };
  fAmt.oninput=recalcTwd; fRate.oninput=recalcTwd;
  fTwd.oninput=()=>{ const a=parseNum(fAmt.value), t=parseNum(fTwd.value); if(a>0 && t>0) fRate.value=+(t/a).toPrecision(5); priceUI(); };
  w.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{ fQty.value=Math.max(1,(parseInt(fQty.value)||1)+ +b.dataset.step); priceUI(); });
  fQty.oninput=priceUI;
  priceUI();

  function collect(){
    let ok=true; const errs=[];
    if(!it.cat){ $('#eCat',w).classList.remove('hide'); ok=false; errs.push('#fCats'); }
    const d=$('#fDate',w).value; const eD=$('#eDate',w); eD.classList.add('hide');
    if(d && d>today()){ eD.textContent='購入日期不能晚於今天'; eD.classList.remove('hide'); ok=false; errs.push('#fDate'); }
    const cur=fCur.value; const amt=parseNum(fAmt.value); const twd=parseNum(fTwd.value); const rate=parseNum(fRate.value);
    const eP=$('#ePrice',w); eP.classList.add('hide'); [fAmt,fTwd,fRate].forEach(x=>x.classList.remove('err'));
    const bad=(el,msg)=>{ el.classList.add('err'); eP.textContent=msg; eP.classList.remove('hide'); ok=false; errs.push('#'+el.id); };
    if(amt!=null && (isNaN(amt)||amt<0)) bad(fAmt,'金額請填 0 以上的數字');
    else if(cur!=='TWD'){
      if(rate!=null && (isNaN(rate)||rate<=0)) bad(fRate,'匯率請填大於 0 的數字');
      else if(twd!=null && (isNaN(twd)||twd<0)) bad(fTwd,'台幣金額請填數字');
      else if(amt!=null && twd==null) bad(fTwd,'沒有匯率可以換算，請填台幣金額或匯率');
    }
    const q=parseInt(fQty.value); if(!q||q<1||q>999){ fQty.value=Math.max(1,Math.min(999,q||1)); }
    if(!ok){ const el=$(errs[0],w); el?.scrollIntoView({behavior:'smooth',block:'center'}); return null; }
    Object.assign(it,{
      name:$('#fName',w).value.trim(), brand:$('#fBrand',w).value.trim(), size:$('#fSize',w).value.trim(),
      date:d||'', store:$('#fStore',w).value.trim(), channel:$('#fChannel',w).value, currency:cur, qty:Math.max(1,Math.min(999,parseInt(fQty.value)||1)),
      location:$('#fLoc',w).value.trim(), note:$('#fNote',w).value.trim(),
      priceOrig: amt==null?null:amt, rate: cur==='TWD'?null:(rate||null),
      price: amt==null? null : (cur==='TWD'? Math.round(amt*100)/100 : (twd!=null?Math.round(twd):null))
    });
    return it;
  }
  async function save(){
    const data=collect(); if(!data) return false;
    const btns=$$('.sh-f button',w); btns.forEach(b=>b.disabled=true);
    try{
      const oldPhoto=item?.photo;
      if(photoFile){ const p=await processImage(photoFile); const pid=uid(); await DB.put('images',{id:pid,full:p.full,thumb:p.thumb}); data.photo=pid; }
      else if(removePhoto) data.photo=null;
      await putItem(data);
      if(oldPhoto && oldPhoto!==data.photo) await deleteImageIfUnused(oldPhoto);
      lsSet('closet.lastEntry',{currency:data.currency});
      return data;
    }catch(e){ toast(e.message||'儲存失敗，請再試一次'); btns.forEach(b=>b.disabled=false); return false; }
  }
  const carryOf=d=>({cat:d.cat,brand:d.brand,seasons:[...(d.seasons||[])],date:d.date,store:d.store,channel:d.channel,currency:d.currency,rate:d.rate,location:d.location});
  w.querySelector('[data-save]').onclick=async()=>{
    const d=await save(); if(!d) return;
    if(batch){ w.close(); nextBatch(batch,carryOf(d),true); return; }
    w.close(); render(); toast(isNew?'已新增「'+itemName(d)+'」':'已儲存');
    if(isNew) setTimeout(()=>maybeOverLimit(d.cat),400);
  };
  w.querySelector('[data-again]')?.addEventListener('click',async()=>{ const d=await save(); if(!d) return; w.close(); render(); toast('已新增「'+itemName(d)+'」，繼續下一件'); setTimeout(()=>openItemForm(null,{carry:carryOf(d)}),360); });
  w.querySelector('[data-skip]')?.addEventListener('click',()=>{ w.close(); nextBatch(batch,carryOf(collectLoose()),false); });
  w.querySelector('[data-cancel]')?.addEventListener('click',()=>w.close());
  w.querySelector('[data-batchstart]')?.addEventListener('click',()=>{ startBatch(); w.close(); });
  w.querySelector('[data-del]')?.addEventListener('click',async()=>{ if(await confirmSheet({title:'刪除這筆紀錄？',msg:'刪除會讓花費統計也少掉這一筆。如果是不要了，請改用「淘汰」保留紀錄。',ok:'刪除',danger:true})){ w.close(); sheets.slice().forEach(s=>s.close()); await deleteWithUndo([item.id]); } });
  function collectLoose(){ return {cat:it.cat,brand:$('#fBrand',w).value.trim(),seasons:it.seasons,date:$('#fDate',w).value,store:$('#fStore',w).value.trim(),channel:$('#fChannel',w).value,currency:fCur.value,rate:parseNum(fRate.value)||null,location:$('#fLoc',w).value.trim()}; }
  return w;
}
function nextBatch(batch,carry,saved){
  batch.saved=(batch.saved||0)+(saved?1:0); batch.cats=batch.cats||new Set(); if(saved&&carry.cat) batch.cats.add(carry.cat);
  if(batch.index+1<batch.files.length){ setTimeout(()=>openItemForm(null,{batch:{...batch,index:batch.index+1},carry}),330); }
  else { render(); toast(`批次建檔完成，共存了 ${batch.saved} 件`);
    const over=[...batch.cats].filter(id=>{ const c=catById(id); return c?.limit && sumQty(ownedItems().filter(i=>i.cat===id))>c.limit; });
    if(over.length) setTimeout(()=>maybeOverLimit(over[0]),500); }
}
function startBatch(){ const inp=$('#fileMany'); inp.value=''; inp.onchange=()=>{ const files=[...inp.files]; if(!files.length) return; if(files.length>60){ toast('一次最多 60 張，先處理前 60 張'); } openItemForm(null,{batch:{files:files.slice(0,60),index:0,saved:0}}); }; inp.click(); }
function maybeOverLimit(catId){
  const c=catById(catId); if(!c?.limit) return; const own=ownedItems().filter(i=>i.cat===catId); const n=sumQty(own); if(n<=c.limit) return;
  const cand=sortItems(own,'idle').slice(0,8);
  const w=openSheet({title:`${c.name}超過上限了`,body:`<p style="margin:0 0 10px">你給自己的上限是 <b class="num">${c.limit}</b> 件，現在有 <b class="num" style="color:var(--brick)">${n}</b> 件。進一件、出一件，要不要挑一件淘汰？</p>
    <p class="muted small" style="margin:0 0 8px">依「最久沒穿」排序：</p><div class="minis">${cand.map(it=>`<button class="mini" data-pick="${it.id}"><div class="ph">${photoHTML(it)}</div><div class="cap">${esc(itemName(it))}</div></button>`).join('')}</div>`,
    foot:`<button class="btn" data-later>先不要</button>`});
  w.querySelector('[data-later]').onclick=()=>w.close();
  w.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{ w.close(); setTimeout(()=>openRetire([b.dataset.pick]),340); });
}

/* ---------- 詳細 ---------- */
function openDetail(id){
  const it=S.items.find(i=>i.id===id); if(!it) return;
  const c=catById(it.cat); const w_=wearCount(it); const lw=lastWear(it); const wornToday=(it.wears||[]).includes(today());
  const colors=(it.colors||[]).map(k=>`<span class="chip" style="height:28px"><i class="sw" style="background:${swBg(k)}"></i>${COLOR[k]?.n}</span>`).join('');
  const priceLine = it.price==null? '—' : (it.currency&&it.currency!=='TWD'&&it.priceOrig!=null? `${money(it.priceOrig,it.currency)}（約 ${money(it.price)}，匯率 ${it.rate??'—'}）` : money(it.price)) + (qtyOf(it)>1&&it.price!=null?`<div class="faint small">${qtyOf(it)} 件，平均每件 ${money(it.price/qtyOf(it))}</div>`:'');
  const facts=[
    ['分類',`${esc(c?.group&&c.group!==c.name?c.group+'・':'')}${esc(catName(it.cat))}`],
    it.brand&&['品牌',esc(it.brand)], it.size&&['尺寸',esc(it.size)],
    it.seasons?.length&&['季節',esc(it.seasons.join('、'))],
    ['購入',`${fmtDate(it.date)}${it.date?`<span class="faint small">（${fmtAge(it.date)}）</span>`:''}`],
    it.store&&['在哪買',esc(it.store)+(it.channel?`<span class="faint small">・${esc(it.channel)}</span>`:'')],
    !it.store&&it.channel&&['管道',esc(it.channel)],
    ['價格',priceLine], qtyOf(it)>1&&['數量',qtyOf(it)+' 件'],
    it.location&&['存放',esc(it.location)], it.lastChecked&&['上次盤點',fmtDate(it.lastChecked)],
    it.note&&['備註',esc(it.note).replace(/\n/g,'<br>')]
  ].filter(Boolean);
  let actions='';
  if(it.status==='active') actions=`<button class="btn" data-sell>想賣掉</button><button class="btn" data-retire>淘汰</button><button class="btn" data-edit>編輯</button>`;
  else if(it.status==='selling') actions=`<button class="btn" data-unsell>取消待售</button><button class="btn soft" data-sold>已賣出</button><button class="btn" data-edit>編輯</button>`;
  else actions=`<button class="btn" data-restore>放回衣櫥</button><button class="btn" data-edit>編輯</button>`;
  const body=`<div class="dt-grid"><div class="dt-photo">${it.photo?`<img alt="" data-img="${esc(it.photo)}" data-kind="full">`:photoHTML(it)}</div><div>
    <div class="dt-tag">${colors}${it.status==='selling'?'<span class="badge sell" style="align-self:center">待售</span>':''}${isIdle(it)?'<span class="badge idle" style="align-self:center">久未穿</span>':''}</div>
    ${it.status==='retired'?`<div class="retinfo"><b>${METHOD[it.retire?.method]||'已淘汰'}</b>　${fmtDate(it.retire?.date)}${it.retire?.method==='sold'?`<br>收入 <span class="num">${money(it.retire.income||0)}</span>${it.price!=null?`，回收了買價的 ${it.price?Math.round((it.retire.income||0)/it.price*100):0}%`:''}`:''}${it.retire?.where?`<br><span class="muted">${esc(it.retire.where)}</span>`:''}${it.retire?.note?`<br><span class="muted">${esc(it.retire.note)}</span>`:''}</div>`:''}
    ${it.status==='selling'?`<div class="retinfo">預計售價 <b class="num">${it.sell?.ask!=null?money(it.sell.ask):'未填'}</b>${it.sell?.platform?`・${esc(it.sell.platform)}`:''}${it.sell?.listedAt?`<br><span class="muted">${fmtDate(it.sell.listedAt)} 開始賣，已經 ${daysSince(it.sell.listedAt)} 天</span>`:''}</div>`:''}
    ${owned(it)?`<div class="wearbox"><div><b>${w_}</b><span>穿過次數</span></div><div><b>${lw?fmtShort(lw):'—'}</b><span>最後一次</span></div><div><b>${it.price==null?'—':money(cpw(it)).replace('NT$','')}</b><span>每次成本</span></div></div>
      <button class="btn ${wornToday?'':'pri'} block" data-wear>${wornToday?'今天已記錄・取消':'今天穿了'}</button>`:''}
    <dl class="facts" style="margin-top:16px">${facts.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
  </div></div>`;
  const w=openSheet({title:itemName(it),body,foot:actions,wide:true});
  const re=()=>{ w.close(); setTimeout(()=>openDetail(id),340); };
  w.querySelector('[data-wear]')?.addEventListener('click',async()=>{ const t=today(); it.wears=it.wears||[]; if(it.wears.includes(t)) it.wears=it.wears.filter(d=>d!==t); else it.wears.push(t); await putItem(it); render(); w.close(); toast(it.wears.includes(t)?`已記錄，這件穿了 ${wearCount(it)} 次`:'已取消今天的紀錄'); });
  w.querySelector('[data-edit]')?.addEventListener('click',()=>{ w.close(); setTimeout(()=>openItemForm(it),340); });
  w.querySelector('[data-retire]')?.addEventListener('click',()=>{ w.close(); setTimeout(()=>openRetire([id]),340); });
  w.querySelector('[data-sell]')?.addEventListener('click',()=>{ w.close(); setTimeout(()=>openSell(id),340); });
  w.querySelector('[data-sold]')?.addEventListener('click',()=>{ w.close(); setTimeout(()=>openRetire([id],{method:'sold'}),340); });
  w.querySelector('[data-unsell]')?.addEventListener('click',async()=>{ it.status='active'; await putItem(it); render(); re(); toast('已取消待售'); });
  w.querySelector('[data-restore]')?.addEventListener('click',async()=>{ it.status='active'; delete it.retire; await putItem(it); render(); re(); toast('已放回衣櫥'); });
}
function fmtShort(s){ const d=daysSince(s); if(d===0) return '今天'; if(d===1) return '昨天'; if(d<31) return d+' 天前'; const [y,m,dd]=s.split('-'); return y===String(new Date().getFullYear())? `${+m}月${+dd}日` : `${y}年`; }
function fmtAge(s){ const d=daysSince(s); if(d<1) return '今天'; if(d<31) return d+' 天前'; if(d<365) return Math.round(d/30.4)+' 個月前'; return (d/365).toFixed(1).replace('.0','')+' 年前'; }

function openRetire(ids,opt={}){
  const items=ids.map(id=>S.items.find(i=>i.id===id)).filter(i=>i&&owned(i)); if(!items.length) return;
  const single=items.length===1?items[0]:null; let method=opt.method||'donate';
  const methods = single? METHODS : METHODS.filter(m=>m[0]!=='sold');
  const body=`${single?'':`<p style="margin:0 0 12px">一次淘汰 <b>${sumQty(items)}</b> 件。<span class="muted small">賣掉的請逐件記錄，才能填各自的收入。</span></p>`}
    <div class="flabel">去向</div><div class="pick" id="rM" style="margin-bottom:14px">${methods.map(([k,n])=>`<button type="button" class="chip${k===method?' on':''}" data-m="${k}">${n}</button>`).join('')}</div>
    <div class="frow"><label class="f"><span>日期</span><input class="in" type="date" id="rDate" value="${today()}" max="${today()}"></label>
    ${single&&qtyOf(single)>1?`<label class="f"><span>淘汰幾件（共 ${qtyOf(single)}）</span><span class="stepper"><button type="button" data-step="-1">−</button><input id="rQty" inputmode="numeric" value="${qtyOf(single)}"><button type="button" data-step="1">＋</button></span></label>`:'<span></span>'}</div>
    <div id="rSold" class="${method==='sold'?'':'hide'}"><div class="frow"><label class="f"><span>賣得多少（台幣）</span><input class="in num" id="rInc" inputmode="numeric" value="${single?.sell?.ask??''}"></label><label class="f"><span>賣到哪</span><input class="in" id="rWhere" value="${esc(single?.sell?.platform||'')}" placeholder="蝦皮、二手店…"></label></div>
      <div class="calc" id="rCalc"></div></div>
    <label class="f"><span>備註</span><input class="in" id="rNote" placeholder="例如：起毛球、尺寸不合"></label><div class="ferr hide" id="rErr"></div>`;
  const w=openSheet({title:single?'淘汰「'+itemName(single)+'」':'淘汰衣物',body,foot:`<button class="btn" data-c>取消</button><button class="btn pri" data-ok>確定淘汰</button>`});
  const calc=()=>{ if(!single||method!=='sold') return; const inc=parseNum($('#rInc',w).value); const q=single&&$('#rQty',w)?Math.max(1,parseInt($('#rQty',w).value)||1):qtyOf(single); const cost=single.price!=null?single.price*q/qtyOf(single):null; $('#rCalc',w).textContent= inc>0&&cost? `買價 ${money(cost)}，賣回 ${Math.round(inc/cost*100)}%，實際花了 ${money(cost-inc)}`:''; };
  $('#rM',w).onclick=e=>{ const b=e.target.closest('[data-m]'); if(!b) return; method=b.dataset.m; $$('#rM .chip',w).forEach(x=>x.classList.toggle('on',x===b)); $('#rSold',w).classList.toggle('hide',method!=='sold'); calc(); };
  $('#rInc',w).oninput=calc; w.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{ const r=$('#rQty',w); r.value=Math.max(1,Math.min(qtyOf(single),(parseInt(r.value)||1)+ +b.dataset.step)); calc(); });
  calc();
  w.querySelector('[data-c]').onclick=()=>w.close();
  w.querySelector('[data-ok]').onclick=async()=>{
    const err=$('#rErr',w); err.classList.add('hide');
    const date=$('#rDate',w).value||today(); if(date>today()){ err.textContent='日期不能晚於今天'; err.classList.remove('hide'); return; }
    let income=null; if(method==='sold'){ income=parseNum($('#rInc',w).value); if(income==null||isNaN(income)||income<0){ err.textContent='請填賣得的金額（送出去沒收錢可以填 0）'; err.classList.remove('hide'); $('#rInc',w).classList.add('err'); return; } income=Math.round(income); }
    const retire={date,method,income,where:method==='sold'?$('#rWhere',w).value.trim():'',note:$('#rNote',w).value.trim()};
    const before=items.map(i=>JSON.parse(JSON.stringify(i)));
    const created=[];
    if(single && $('#rQty',w)){
      const q=Math.max(1,Math.min(qtyOf(single),parseInt($('#rQty',w).value)||1));
      if(q<qtyOf(single)){ // 部分淘汰：拆出一筆已淘汰的紀錄，價格按比例分
        const total=qtyOf(single); const part={...JSON.parse(JSON.stringify(single)),id:uid(),qty:q,status:'retired',retire,createdAt:single.createdAt};
        if(single.price!=null){ part.price=Math.round(single.price*q/total); single.price=single.price-part.price; }
        if(single.priceOrig!=null){ part.priceOrig=Math.round(single.priceOrig*q/total*100)/100; single.priceOrig=Math.round((single.priceOrig-part.priceOrig)*100)/100; }
        delete part.sell; single.qty=total-q; await putItem(part); await putItem(single); created.push(part.id);
        w.close(); render(); toast(`已淘汰 ${q} 件，還留 ${single.qty} 件`,{label:'復原',fn:async()=>{ await removeItem(part.id); await putItem(before[0]); render(); toast('已復原'); }}); return;
      }
    }
    for(const it of items){ it.status='retired'; it.retire={...retire}; delete it.sell; await putItem(it); }
    w.close(); S.sel.clear(); S.selecting=false; render();
    toast(`已記錄：${METHOD[method]} ${sumQty(items)} 件`,{label:'復原',fn:async()=>{ for(const b of before) await putItem(b); render(); toast('已復原'); }});
  };
}
async function deleteWithUndo(ids){

function runCheck(ids){
  let i=0; const res={keep:0,retire:0,lost:0,skip:0};
  const w=openSheet({title:'盤點中',body:'<div id="ckBody"></div>',foot:'<div class="btnrow" style="width:100%"><button class="btn" data-k="lost">找不到</button><button class="btn" data-k="retire">要淘汰</button><button class="btn pri" data-k="keep">還在</button></div>',onClose:()=>{ S.settings.lastCheckAt=Date.now(); saveSettings(); render(); }});
  const foot=w.querySelector('.sh-f');
  const draw=()=>{
    while(i<ids.length && !S.items.find(x=>x.id===ids[i]&&owned(x))) i++;
    const body=$('#ckBody',w);
    if(i>=ids.length){ w.setTitle('盤點完成'); foot.innerHTML='<button class="btn pri block" data-done>完成</button>'; foot.querySelector('[data-done]').onclick=()=>w.close();
      body.innerHTML=`<div class="checkcard"><p class="lede">盤點了 <b>${res.keep+res.retire+res.lost}</b> 筆</p><p class="muted">還在 ${res.keep}・淘汰 ${res.retire}・找不到 ${res.lost}${res.skip?`・略過 ${res.skip}`:''}</p></div>`; return; }
    const it=S.items.find(x=>x.id===ids[i]);
    body.innerHTML=`<div class="prog"><i style="width:${i/ids.length*100}%"></i></div><div class="checkcard"><div class="ph">${it.photo?`<img alt="" data-img="${esc(it.photo)}">`:photoHTML(it)}</div>
      <div style="font-weight:700;font-size:17px">${esc(itemName(it))}${qtyOf(it)>1?` <span class="num">×${qtyOf(it)}</span>`:''}</div>
      <div class="muted small">${esc(catName(it.cat))}${it.brand?'・'+esc(it.brand):''}${it.location?'・放在'+esc(it.location):''}</div>
      <div class="muted small">${it.date?fmtAge(it.date)+'買的':'購入日期不詳'}・穿過 ${wearCount(it)} 次</div>
      <div style="margin-top:10px"><span class="muted small">${i+1} / ${ids.length}</span>　<button class="linkbtn" data-skip>略過</button></div></div>`;
    hydrateImages(body); body.querySelector('[data-skip]').onclick=()=>{ res.skip++; i++; draw(); };
  };
  foot.addEventListener('click',async e=>{ const b=e.target.closest('[data-k]'); if(!b) return; const it=S.items.find(x=>x.id===ids[i]); if(!it) return;
    if(b.dataset.k==='keep'){ it.lastChecked=today(); await putItem(it); res.keep++; i++; draw(); }
    else if(b.dataset.k==='lost'){ it.status='retired'; it.retire={date:today(),method:'lost',income:null,where:'',note:'盤點時找不到'}; delete it.sell; await putItem(it); res.lost++; i++; draw(); }
    else { it.lastChecked=today(); await putItem(it); const qBefore=qtyOf(it); openRetire([it.id]);
      const top=sheets[sheets.length-1]; const orig=top.close; top.close=()=>{ orig(); setTimeout(()=>{ const now=S.items.find(x=>x.id===it.id); if(!now||!owned(now)||qtyOf(now)<qBefore) res.retire++; i++; draw(); },10); }; }
  });
  draw();
}
