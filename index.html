/* ---------- 匯出／匯入 ---------- */
function abToB64(buf){ const u=new Uint8Array(buf); let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
function b64ToAb(b){ const s=atob(b); const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u.buffer; }
function stamp(){ const d=new Date(); return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`; }
async function deliverFile(file,label,onDone){
  const out=$('#exportOut'); if(!out) return;
  const sizeMB=file.size/1048576;
  out.innerHTML=`<div class="similar" style="margin:12px 0 0">${esc(file.name)}（${sizeMB<1?Math.max(1,Math.round(file.size/1024))+' KB':sizeMB.toFixed(1)+' MB'}）已準備好。<div class="btnrow" style="margin-top:8px"><button class="btn pri" data-get>${isIOS?'儲存到「檔案」或分享':'下載'}${esc(label)}</button></div></div>`;
  out.querySelector('[data-get]').onclick=async()=>{
    if(isIOS && navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:file.name}); onDone&&onDone(); toast('已送出'); return; }
      catch(e){ if(e.name==='AbortError') return; }
    }
    const url=URL.createObjectURL(file); const a=document.createElement('a'); a.href=url; a.download=file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),30000); onDone&&onDone(); toast('已開始下載');
  };
}
async function doExport(){
  const out=$('#exportOut'); out.innerHTML='<p class="muted small" style="margin:12px 0 0">正在打包…</p>';
  try{
    const imgs=await DB.getAll('images'); const used=new Set(S.items.map(i=>i.photo).filter(Boolean));
    const payload={app:'closet-ledger',version:1,exportedAt:Date.now(),items:S.items,settings:{...S.settings,lastBackup:undefined},
      images:imgs.filter(i=>used.has(i.id)).map(i=>({id:i.id,full:{type:i.full.type,b64:abToB64(i.full.buf)},thumb:{type:i.thumb.type,b64:abToB64(i.thumb.buf)}}))};
    const file=new File([JSON.stringify(payload)],`衣櫥帳本備份-${stamp()}.json`,{type:'application/json'});
    deliverFile(file,'備份',async()=>{ S.settings.lastBackup=Date.now(); await saveSettings(); $('#navSet').classList.toggle('dot',backupDue()); });
  }catch(e){ out.innerHTML=`<p class="ferr">匯出失敗：${esc(e.message)}</p>`; }
}
function csvCell(v){ v=v==null?'':String(v); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function doCSV(){
  const head=['狀態','大類','分類','名稱','顏色','品牌','尺寸','季節','數量','購入日期','在哪買','管道','幣別','原幣金額','匯率','台幣金額','存放位置','穿過次數','最後穿著','每次成本','淘汰日期','去向','轉賣收入','賣到哪','備註'];
  const st={active:'在衣櫥',selling:'待售',retired:'已淘汰'};
  const rows=sortItems(S.items,'new').map(it=>[st[it.status],catById(it.cat)?.group||'',catName(it.cat),itemName(it),(it.colors||[]).map(c=>COLOR[c]?.n).join('、'),it.brand,it.size,(it.seasons||[]).join(''),qtyOf(it),it.date,it.store,it.channel,it.currency,it.priceOrig,it.rate,it.price,it.location,wearCount(it),lastWear(it),it.price!=null&&wearCount(it)?Math.round(cpw(it)):'',it.retire?.date,METHOD[it.retire?.method]||'',it.retire?.income,it.retire?.where,[it.note,it.retire?.note].filter(Boolean).join('／')]);
  const csv='﻿'+[head,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n');
  deliverFile(new File([csv],`衣櫥清單-${stamp()}.csv`,{type:'text/csv'}),' Excel 清單');
}
function doImport(){
  const inp=$('#fileBackup'); inp.value='';
  inp.onchange=async()=>{
    const file=inp.files[0]; if(!file) return;
    let data; try{ data=JSON.parse(await file.text()); }catch(e){ toast('這個檔案不是衣櫥帳本的備份檔'); return; }
    if(data?.app!=='closet-ledger'||!Array.isArray(data.items)){ toast('這個檔案不是衣櫥帳本的備份檔'); return; }
    const w=openSheet({title:'匯入備份',body:`<p style="margin:0 0 6px">備份檔裡有 <b>${data.items.length}</b> 筆衣物、${(data.images||[]).length} 張照片（${fmtDate(ymd(new Date(data.exportedAt)))} 匯出）。</p>
      <p class="muted small" style="margin:0 0 12px">這台裝置現在有 ${S.items.length} 筆。</p>
      <div class="list"><button class="li" data-mode="merge"><span class="tx"><div>合併</div><div class="muted small">兩邊的都留下；同一筆衣物以較新修改的為準</div></span></button>
      <button class="li" data-mode="replace"><span class="tx"><div style="color:var(--brick)">全部取代</div><div class="muted small">刪掉這台裝置的資料，完全換成備份檔的內容</div></span></button></div>`});
    w.querySelectorAll('[data-mode]').forEach(b=>b.onclick=async()=>{
      const mode=b.dataset.mode;
      if(mode==='replace' && S.items.length && !(await confirmSheet({title:'確定全部取代？',msg:`這台裝置上的 ${S.items.length} 筆資料會被刪除，無法復原。`,ok:'全部取代',danger:true}))) return;
      try{
        const imgs=(data.images||[]).map(i=>({id:i.id,full:{type:i.full.type,buf:b64ToAb(i.full.b64)},thumb:{type:i.thumb.type,buf:b64ToAb(i.thumb.b64)}}));
        let added=0,updated=0;
        if(mode==='replace'){
          await DB.clear('items'); await DB.clear('images'); urlCache.forEach(u=>URL.revokeObjectURL(u)); urlCache.clear();
          await DB.putMany('images',imgs); await DB.putMany('items',data.items); S.items=data.items.slice(); added=data.items.length;
          if(data.settings){ S.settings={...defaultSettings(),...data.settings,lastBackup:S.settings.lastBackup,firstUse:S.settings.firstUse}; rebuildColors(); await saveSettings(); }
        } else {
          const have=new Map(S.items.map(i=>[i.id,i])); const toPut=[];
          data.items.forEach(it=>{ const h=have.get(it.id); if(!h){ toPut.push(it); added++; } else if((it.updatedAt||0)>(h.updatedAt||0)){ toPut.push(it); updated++; } });
          const haveImg=new Set((await DB.getAll('images')).map(i=>i.id)); await DB.putMany('images',imgs.filter(i=>!haveImg.has(i.id)));
          await DB.putMany('items',toPut); toPut.forEach(it=>{ const k=S.items.findIndex(x=>x.id===it.id); if(k>=0) S.items[k]=it; else S.items.push(it); });
          if(data.settings?.cats){ // 合併分類：補上這台沒有的分類
            data.settings.groups?.forEach(g=>{ if(!S.settings.groups.includes(g)) S.settings.groups.push(g); });
            data.settings.cats.forEach(c=>{ if(!catById(c.id)) S.settings.cats.push({...c,order:S.settings.cats.length}); });
            await saveSettings(); }
          if(data.settings){ // 合併自訂顏色與管道
            const cc=S.settings.customColors||[]; (data.settings.customColors||[]).forEach(c=>{ if(!cc.some(x=>x.k===c.k)) cc.push(c); }); S.settings.customColors=cc;
            const ch=S.settings.channels||[...DEFAULT_CHANNELS]; (data.settings.channels||[]).forEach(c=>{ if(!ch.includes(c)) ch.push(c); }); S.settings.channels=ch;
            rebuildColors(); await saveSettings(); }
        }
        w.close(); render(); toast(mode==='replace'?`已匯入 ${added} 筆`:`新增 ${added} 筆、更新 ${updated} 筆`);
      }catch(e){ toast('匯入失敗：'+e.message); }
    });
  };
  inp.click();
}

/* ---------- 事件 ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]'); if(!b) return; const a=b.dataset.a;
  const st=S.settings;
  switch(a){
    case 'nav': if(b.dataset.sec) pendingSec=b.dataset.sec; setView(b.dataset.v); break;
    case 'add': openItemForm(null); break;
    case 'batch': startBatch(); break;
    case 'status': S.f.status=b.dataset.k; saveFilters(); render(); break;
    case 'railc': { const k=b.dataset.k; const i=S.f.colors.indexOf(k); if(i>=0) S.f.colors.splice(i,1); else S.f.colors=[k]; saveFilters(); render(); break; }
    case 'rmf': { const arr=S.f[b.dataset.k]; const i=arr.indexOf(b.dataset.v); if(i>=0) arr.splice(i,1); saveFilters(); render(); break; }
    case 'clearf': ['cats','colors','brands','stores','seasons','locations'].forEach(k=>S.f[k]=[]); S.f.q=''; saveFilters(); render(); break;
    case 'filters': openFilters(); break;
    case 'selmode': S.selecting=!S.selecting; S.sel.clear(); render(); break;
    case 'tile': if(S.selecting){ const id=b.dataset.id; S.sel.has(id)?S.sel.delete(id):S.sel.add(id); b.classList.toggle('sel'); renderSelbar(); } else openDetail(b.dataset.id); break;
    case 'open': openDetail(b.dataset.id); break;
    case 'gocat': S.f={...S.f,status:'own',cats:[b.dataset.k],colors:[],brands:[],stores:[],seasons:[],locations:[],q:''}; saveFilters(); setView('closet'); break;
    case 'seeidle': S.f={...S.f,status:'own',cats:[],colors:[],brands:[],stores:[],seasons:[],locations:[],q:'',sort:'idle'}; saveFilters(); setView('closet'); break;
    case 'buycheck': openBuyCheck(); break;
    case 'check': openCheck(); break;
    case 'bulkwear': { const t=today(); let n=0; for(const id of S.sel){ const it=S.items.find(i=>i.id===id); if(it&&owned(it)&&!(it.wears||[]).includes(t)){ it.wears=[...(it.wears||[]),t]; await putItem(it); n++; } } S.selecting=false; S.sel.clear(); render(); toast(n?`已記錄 ${n} 件今天穿了`:'選的都已經記錄過今天了'); break; }
    case 'bulkloc': { const locs=[...new Set([...DEFAULT_LOCATIONS,...brandDisplayMap('location').values()])];
      const w=openSheet({title:`改存放位置（${S.sel.size} 筆）`,body:`<label class="f"><span>移到</span><input class="in" id="blLoc" list="dlBl" placeholder="例如：收納箱 A"></label><datalist id="dlBl">${locs.map(l=>`<option value="${esc(l)}">`).join('')}</datalist>`,foot:'<button class="btn" data-c>取消</button><button class="btn pri" data-ok>移過去</button>'});
      w.querySelector('[data-c]').onclick=()=>w.close();
      w.querySelector('[data-ok]').onclick=async()=>{ const v=$('#blLoc',w).value.trim(); for(const id of S.sel){ const it=S.items.find(i=>i.id===id); if(it){ it.location=v; await putItem(it); } } const n=S.sel.size; w.close(); S.selecting=false; S.sel.clear(); render(); toast(v?`已把 ${n} 筆移到「${v}」`:`已清除 ${n} 筆的存放位置`); };
      setTimeout(()=>$('#blLoc',w)?.focus(),350); break; }
    case 'bulkretire': openRetire([...S.sel]); break;
    case 'bulkdel': if(await confirmSheet({title:`刪除 ${S.sel.size} 筆紀錄？`,msg:'刪除會讓花費統計也少掉這些。如果是不要了，請改用「淘汰」保留紀錄。',ok:'刪除',danger:true})) await deleteWithUndo([...S.sel]); break;
    case 'export': doExport(); break;
    case 'csv': doCSV(); break;
    case 'import': doImport(); break;
    case 'rates': b.disabled=true; b.textContent='更新中…'; try{ await refreshRates(true); toast('匯率已更新'); }catch(err){ toast('連不到匯率網站，請稍後再試，或手動填匯率'); } render(); break;
    case 'theme': st.theme=b.dataset.k; applyTheme(); await saveSettings(); render(); break;
    case 'namesTab': namesTab=b.dataset.k; render(); break;
    case 'rename': { const old=b.dataset.v; const label={brand:'品牌',store:'店家',location:'存放位置'}[namesTab];
      const w=openSheet({title:`${label}改名`,body:`<label class="f"><span>「${esc(old)}」改成</span><input class="in" id="rnV" value="${esc(old)}"></label><p class="muted small" style="margin:0">會一起改掉所有用到「${esc(old)}」的衣物。改成已有的名稱就會合併在一起。</p>`,foot:'<button class="btn" data-c>取消</button><button class="btn pri" data-ok>改名</button>'});
      w.querySelector('[data-c]').onclick=()=>w.close();
      w.querySelector('[data-ok]').onclick=async()=>{ const v=$('#rnV',w).value.trim(); if(!v){ toast('名稱不能空白'); return; } let n=0; for(const it of S.items){ if((it[namesTab]||'').trim()===old){ it[namesTab]=v; await putItem(it); n++; } } w.close(); render(); toast(`已更新 ${n} 筆`); }; break; }
    case 'addcat': { if(await addCategory(b.dataset.k)) render(); break; }
    case 'addcolor': { if(await addCustomColor()) render(); break; }
    case 'editcolor': { const c=(st.customColors||[]).find(x=>x.k===b.dataset.k); if(!c) return; const used=S.items.filter(i=>(i.colors||[]).includes(c.k));
      const w=openSheet({title:`顏色「${c.n}」`,body:`<p class="muted small" style="margin:0 0 12px">有 ${used.length} 筆衣物用到這個顏色。</p><div class="btnrow"><button class="btn" data-edit>改名稱或色彩</button><button class="btn danger" data-del>刪除這個顏色</button></div>`});
      w.querySelector('[data-edit]').onclick=async()=>{ w.close(); const r=await colorSheet(c); if(!r) return; Object.assign(c,r); rebuildColors(); await saveSettings(); render(); toast('已更新顏色'); };
      w.querySelector('[data-del]').onclick=async()=>{ w.close(); if(!(await confirmSheet({title:`刪除顏色「${c.n}」？`,msg:used.length?`${used.length} 筆衣物會拿掉這個顏色，其他資料不受影響。`:'沒有衣物用到這個顏色。',ok:'刪除',danger:true}))) return;
        for(const it of used){ it.colors=it.colors.filter(x=>x!==c.k); await putItem(it); } st.customColors=st.customColors.filter(x=>x!==c); S.f.colors=S.f.colors.filter(x=>x!==c.k); saveFilters(); rebuildColors(); await saveSettings(); render(); toast('已刪除顏色'); };
      break; }
    case 'addchannel': { if(await addChannel()) render(); break; }
    case 'chren': { const i=+b.dataset.k; st.channels=st.channels||[...DEFAULT_CHANNELS]; const old=st.channels[i]; const v=await askText('管道改名','管道名稱',old); if(!v||v===old) return; if(st.channels.includes(v)){ toast('已經有「'+v+'」了'); return; }
      st.channels[i]=v; let n=0; for(const it of S.items){ if(it.channel===old){ it.channel=v; await putItem(it); n++; } } await saveSettings(); render(); toast(n?`已改名，並更新 ${n} 筆衣物`:'已改名'); break; }
    case 'chdel': { const i=+b.dataset.k; st.channels=st.channels||[...DEFAULT_CHANNELS]; const c=st.channels[i]; const n=S.items.filter(it=>it.channel===c).length;
      if(await confirmSheet({title:`刪除管道「${c}」？`,msg:n?`選單裡不再出現，但已經記錄的 ${n} 筆衣物會保留「${c}」。`:'選單裡不再出現這個選項。',ok:'刪除',danger:true})){ st.channels.splice(i,1); await saveSettings(); render(); toast('已刪除'); } break; }
    case 'addgroup': { await addGroup(false); render(); break; }
    case 'grpren': { const gi=+b.dataset.k; const old=st.groups[gi]; const name=await askText('大類改名','大類名稱',old); if(!name||name===old) return; if(st.groups.includes(name)){ toast('已經有這個大類'); return; } st.groups[gi]=name; st.cats.forEach(c=>{ if(c.group===old) c.group=name; }); await saveSettings(); render(); break; }
    case 'grpdel': { const gi=+b.dataset.k; st.groups.splice(gi,1); await saveSettings(); render(); break; }
    case 'grpup': case 'grpdown': { const gi=+b.dataset.k, j=a==='grpup'?gi-1:gi+1; [st.groups[gi],st.groups[j]]=[st.groups[j],st.groups[gi]]; await saveSettings(); render(); break; }
    case 'catup': case 'catdown': { const c=catById(b.dataset.k); const sib=cats().filter(x=>x.group===c.group); const i=sib.indexOf(c); const o=sib[a==='catup'?i-1:i+1]; if(o){ [c.order,o.order]=[o.order,c.order]; await saveSettings(); render(); } break; }
    case 'catdel': { const c=catById(b.dataset.k); const used=S.items.filter(i=>i.cat===c.id);
      if(!used.length){ if(await confirmSheet({title:`刪除分類「${c.name}」？`,msg:'這個分類沒有衣物，可以直接刪除。',ok:'刪除',danger:true})){ st.cats=st.cats.filter(x=>x!==c); await saveSettings(); render(); } return; }
      const others=cats().filter(x=>x!==c); if(!others.length) return;
      const w=openSheet({title:`刪除分類「${c.name}」`,body:`<p style="margin:0 0 12px">這個分類還有 ${used.length} 筆紀錄（含已淘汰），要先移到哪個分類？</p><select class="in" id="mvTo">${others.map(o=>`<option value="${o.id}">${esc(o.group)}・${esc(o.name)}</option>`).join('')}</select>`,foot:'<button class="btn" data-c>取消</button><button class="btn danger" data-ok>移過去並刪除</button>'});
      w.querySelector('[data-c]').onclick=()=>w.close();
      w.querySelector('[data-ok]').onclick=async()=>{ const to=$('#mvTo',w).value; for(const it of used){ it.cat=to; await putItem(it); } st.cats=st.cats.filter(x=>x!==c); S.f.cats=S.f.cats.filter(x=>x!==c.id); saveFilters(); await saveSettings(); w.close(); render(); toast(`已移到「${catName(to)}」並刪除分類`); }; break; }
    case 'wipe': if(await confirmSheet({title:'清除所有資料？',msg:`會刪掉 ${S.items.length} 筆衣物、所有照片與設定，無法復原。`,ok:'下一步',danger:true})){
      if(await confirmSheet({title:'最後確認',msg:'真的要清除嗎？',ok:'全部清除',danger:true})){ await DB.clear('items'); await DB.clear('images'); await DB.clear('meta'); urlCache.clear(); S.items=[]; S.settings=defaultSettings(); rebuildColors(); await saveSettings(); setView('closet'); toast('已清除所有資料'); } } break;
  }
});
function askText(title,label,val){
  return new Promise(res=>{ let done=false;
    const w=openSheet({title,body:`<label class="f"><span>${esc(label)}</span><input class="in" id="atV" value="${esc(val)}"></label>`,foot:'<button class="btn" data-c>取消</button><button class="btn pri" data-ok>確定</button>',onClose:()=>{ if(!done) res(null); }});
    const inp=$('#atV',w); setTimeout(()=>inp.focus(),350);
    const ok=()=>{ const v=inp.value.trim(); if(!v){ inp.classList.add('err'); return; } done=true; w.close(); res(v); };
    w.querySelector('[data-ok]').onclick=ok; inp.onkeydown=e=>{ if(e.key==='Enter') ok(); }; w.querySelector('[data-c]').onclick=()=>w.close();
  });
}
function applyTheme(){ const t=S.settings?.theme||'auto'; if(t==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',t);
  const meta=$$('meta[name=theme-color]'); if(t==='auto'){ meta[0].setAttribute('media','(prefers-color-scheme: light)'); meta[1].setAttribute('media','(prefers-color-scheme: dark)'); meta[0].content='#E7E5E0'; meta[1].content='#1F1E1C'; } else { meta.forEach(m=>{ m.removeAttribute('media'); m.content=t==='dark'?'#1F1E1C':'#E7E5E0'; }); } }

/* ---------- 啟動 ---------- */
(async function init(){
  try{ await DB.open(); }
  catch(e){ $('#app').innerHTML=`<div class="empty"><h3>無法開啟本機資料庫</h3><p>${/blocked/.test(e.message)?'App 在另一個分頁開著，請關掉其他分頁後重新整理。':'可能是「私密瀏覽」模式或瀏覽器停用了網站資料。請改用一般模式開啟。'}</p></div>`; return; }
  S.items=await DB.getAll('items');
  const st=await DB.get('meta','settings'); S.settings=st?{...defaultSettings(),...st.value}:defaultSettings(); if(!st) await saveSettings(); rebuildColors();
  const r=await DB.get('meta','rates'); S.rates=r?r.value:null;
  const f=lsGet('closet.f'); if(f) S.f={...S.f,...f};
  const v=lsGet('closet.view'); if(v) S.view=v;
  applyTheme(); render();
  refreshRates(false).then(ch=>{ if(ch && S.view==='settings') render(); });
  if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
